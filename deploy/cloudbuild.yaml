steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'VITE_NEON_AUTH_URL=${_NEON_AUTH_URL}', '-f', 'backend/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/daleel/backend:${_IMAGE_TAG}', '.']
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/daleel/backend:${_IMAGE_TAG}']
substitutions:
  _REGION: europe-west1
  _IMAGE_TAG: local
  _NEON_AUTH_URL: ""
options:
  logging: CLOUD_LOGGING_ONLY
