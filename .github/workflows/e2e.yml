name: Browser E2E
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.lock
          backend/.venv/bin/pip install -e 'backend[dev]'
          npm ci
          npm --prefix frontend ci
          npx @e2e-dev/web install chromium --with-deps
      - name: Allow the synthetic web source on standard port 80
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Verify browser flows without subscription credentials
        run: npx e2e run --exclude-tag agent --trace --reporter list,junit,markdown
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/summary.md
            .e2e/results
          retention-days: 7
