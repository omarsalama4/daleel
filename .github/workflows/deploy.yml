name: Deploy beta
on:
  workflow_dispatch:
concurrency:
  group: daleel-production
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  browser-verification:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
  deploy:
    needs: browser-verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: daleel_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d daleel_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DALEEL_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-disposable-only@localhost:5432/daleel_ci
    environment: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release source
        run: |
          pip install -r backend/requirements.lock && pip install -e 'backend[dev]'
          python -m playwright install --with-deps chromium
          ruff check backend/daleel backend/migrations
          pytest backend/tests -q
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.lock --no-deps --disable-pip
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend audit --audit-level=high
          npm --prefix frontend run build
      - name: Validate deployment configuration before cloud changes
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SECRET_VERSION: ${{ vars.RUNTIME_SECRET_VERSION }}
          MIGRATION_SECRET_VERSION: ${{ vars.MIGRATION_SECRET_VERSION }}
          BROKER_SECRET_VERSION: ${{ vars.BROKER_SECRET_VERSION }}
          AUTH_URL: ${{ vars.NEON_AUTH_URL }}
        run: |
          python - <<'PY'
          import os, re
          for key in ('RUNTIME_SECRET_VERSION', 'MIGRATION_SECRET_VERSION', 'BROKER_SECRET_VERSION'):
              if not re.fullmatch(r'[1-9][0-9]*', os.environ.get(key, '')):
                  raise SystemExit(key + ' must pin a positive numeric secret version')
          if not os.environ.get('PROJECT') or not os.environ.get('REGION'):
              raise SystemExit('Deployment project and region must be configured')
          if not os.environ.get('AUTH_URL', '').startswith('https://'):
              raise SystemExit('Neon Auth requires a configured HTTPS origin')
          print('Deployment configuration preflight passed')
          PY
      - name: Verify deployment identity claims
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, urllib.parse
          audience = 'https://iam.googleapis.com/' + os.environ['WIF_PROVIDER']
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(audience, safe='')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          # Public repository identity only; never log a bearer token or full payload.
          print(json.dumps({key: claims.get(key) for key in ('repository', 'ref', 'workflow_ref', 'sub', 'repository_id', 'repository_owner_id')}))
          PY
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify build resource access before upload
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SOURCE_BUCKET: ${{ vars.GCP_BUILD_SOURCE_BUCKET }}
        run: |
          test -n "$SOURCE_BUCKET"
          gcloud storage buckets describe "gs://$SOURCE_BUCKET" --format='value(name)'
          gcloud artifacts repositories describe daleel --project="$PROJECT" --location="$REGION" --format='value(name)'
      - name: Build image
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          NEON_AUTH_URL: ${{ vars.NEON_AUTH_URL }}
          BUILD_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          SOURCE_BUCKET: ${{ vars.GCP_BUILD_SOURCE_BUCKET }}
        run: |
          gcloud builds submit --project="$PROJECT" --service-account="projects/$PROJECT/serviceAccounts/$BUILD_ACCOUNT" --gcs-source-staging-dir="gs://$SOURCE_BUCKET/source" --config=deploy/cloudbuild.yaml --substitutions="_REGION=$REGION,_IMAGE_TAG=$GITHUB_SHA,_NEON_AUTH_URL=$NEON_AUTH_URL" .
      - name: Deploy isolated human browser broker
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          BROKER_ACCOUNT: ${{ vars.GCP_BROKER_SERVICE_ACCOUNT }}
          BROKER_SECRET_VERSION: ${{ vars.BROKER_SECRET_VERSION }}
        run: |
          test -n "$BROKER_ACCOUNT" && test -n "$BROKER_SECRET_VERSION"
          test "$BROKER_SECRET_VERSION" != latest
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/daleel/backend:$GITHUB_SHA"
          gcloud run deploy daleel-broker --project="$PROJECT" --region="$REGION" --image="$IMAGE" --command=uvicorn --args=daleel.broker:app,--host,0.0.0.0,--port,8080,--no-access-log --memory=2Gi --cpu=1 --max-instances=1 --min-instances=0 --concurrency=10 --timeout=60s --service-account="$BROKER_ACCOUNT" --set-secrets=/var/secrets/daleel/runtime.env=daleel-broker-env:$BROKER_SECRET_VERSION --set-env-vars=DALEEL_CONFIG_FILE=/var/secrets/daleel/runtime.env --allow-unauthenticated
          BROKER_URL=$(gcloud run services describe daleel-broker --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BROKER_URL/viewer/invalid-smoke-capability")" = 410
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{"id":"00000000-0000-0000-0000-000000000001","workspaceId":"00000000-0000-0000-0000-000000000002","url":"https://example.com/"}' "$BROKER_URL/connections")" = 401
      - name: Deploy worker and API
        id: deployment
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          MIGRATION_ACCOUNT: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
          SCHEDULER_ACCOUNT: ${{ vars.GCP_SCHEDULER_SERVICE_ACCOUNT }}
          RUNTIME_SECRET_VERSION: ${{ vars.RUNTIME_SECRET_VERSION }}
          MIGRATION_SECRET_VERSION: ${{ vars.MIGRATION_SECRET_VERSION }}
        run: |
          test -n "$RUNTIME_SECRET_VERSION" && test -n "$MIGRATION_SECRET_VERSION"
          test "$RUNTIME_SECRET_VERSION" != latest && test "$MIGRATION_SECRET_VERSION" != latest
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/daleel/backend:$GITHUB_SHA"
          gcloud run jobs deploy daleel-migrate --project="$PROJECT" --region="$REGION" --image="$IMAGE" --command=sh --args=-c,'python -m alembic -c /app/alembic.ini upgrade head && python -m daleel.bootstrap' --tasks=1 --max-retries=0 --task-timeout=10m --service-account="$MIGRATION_ACCOUNT" --set-secrets=DALEEL_MIGRATION_DATABASE_URL=daleel-migration-database:$MIGRATION_SECRET_VERSION
          gcloud run jobs execute daleel-migrate --project="$PROJECT" --region="$REGION" --wait
          gcloud run jobs deploy daleel-worker --project="$PROJECT" --region="$REGION" --image="$IMAGE" --command=python --args=-m,daleel.worker --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=30m --memory=2Gi --cpu=1 --service-account="$RUNTIME_ACCOUNT" --set-secrets=/var/secrets/daleel/runtime.env=daleel-runtime-env:$RUNTIME_SECRET_VERSION --set-env-vars=DALEEL_CONFIG_FILE=/var/secrets/daleel/runtime.env
          gcloud run jobs add-iam-policy-binding daleel-worker --project="$PROJECT" --region="$REGION" --member="serviceAccount:$RUNTIME_ACCOUNT" --role=roles/run.jobsExecutorWithOverrides
          gcloud run jobs deploy daleel-recovery --project="$PROJECT" --region="$REGION" --image="$IMAGE" --command=python --args=-m,daleel.worker,--recover --tasks=1 --max-retries=0 --task-timeout=10m --service-account="$RUNTIME_ACCOUNT" --set-secrets=/var/secrets/daleel/runtime.env=daleel-runtime-env:$RUNTIME_SECRET_VERSION --set-env-vars=DALEEL_CONFIG_FILE=/var/secrets/daleel/runtime.env
          gcloud run jobs add-iam-policy-binding daleel-recovery --project="$PROJECT" --region="$REGION" --member="serviceAccount:$SCHEDULER_ACCOUNT" --role=roles/run.invoker
          READY_REVISION=$(gcloud run services describe daleel-api --project="$PROJECT" --region="$REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)
          if test -n "$READY_REVISION"; then
            gcloud run deploy daleel-api --project="$PROJECT" --region="$REGION" --image="$IMAGE" --memory=512Mi --cpu=1 --max-instances=2 --concurrency=20 --service-account="$RUNTIME_ACCOUNT" --set-secrets=/var/secrets/daleel/runtime.env=daleel-runtime-env:$RUNTIME_SECRET_VERSION --set-env-vars=DALEEL_CONFIG_FILE=/var/secrets/daleel/runtime.env --no-traffic --tag candidate
          else
            # A first revision cannot use --no-traffic. Keep it private until smoke passes.
            gcloud run deploy daleel-api --project="$PROJECT" --region="$REGION" --image="$IMAGE" --memory=512Mi --cpu=1 --max-instances=2 --concurrency=20 --service-account="$RUNTIME_ACCOUNT" --set-secrets=/var/secrets/daleel/runtime.env=daleel-runtime-env:$RUNTIME_SECRET_VERSION --set-env-vars=DALEEL_CONFIG_FILE=/var/secrets/daleel/runtime.env --no-allow-unauthenticated --tag candidate
          fi
          CANDIDATE=$(gcloud run services describe daleel-api --project="$PROJECT" --region="$REGION" --format=json | python -c 'import json,sys; print(next(t["url"] for t in json.load(sys.stdin)["status"]["traffic"] if t.get("tag")=="candidate"))')
          echo "candidate_url=$CANDIDATE" >> "$GITHUB_OUTPUT"
          SERVICE_URL=$(gcloud run services describe daleel-api --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - name: Authenticate candidate smoke
        id: candidate_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deployment.outputs.service_url }}
          create_credentials_file: false
      - name: Verify candidate and publish
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SCHEDULER_ACCOUNT: ${{ vars.GCP_SCHEDULER_SERVICE_ACCOUNT }}
          CANDIDATE: ${{ steps.deployment.outputs.candidate_url }}
          CANDIDATE_TOKEN: ${{ steps.candidate_auth.outputs.id_token }}
        run: |
          curl --fail --retry 5 --retry-delay 3 -H "Authorization: Bearer $CANDIDATE_TOKEN" "$CANDIDATE/ready"
          curl --fail -H "Authorization: Bearer $CANDIDATE_TOKEN" "$CANDIDATE/sign-in" | grep -q '<div id="root">'
          # A cloud invocation token must not grant a Daleel application session.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CANDIDATE_TOKEN" "$CANDIDATE/api/v1/me")" = 401
          JOB_URI="https://run.googleapis.com/v2/projects/$PROJECT/locations/$REGION/jobs/daleel-recovery:run"
          if gcloud scheduler jobs describe daleel-recovery --project="$PROJECT" --location="$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http daleel-recovery --project="$PROJECT" --location="$REGION" --schedule='*/15 * * * *' --uri="$JOB_URI" --http-method=POST --oauth-service-account-email="$SCHEDULER_ACCOUNT"
          else
            gcloud scheduler jobs create http daleel-recovery --project="$PROJECT" --location="$REGION" --schedule='*/15 * * * *' --uri="$JOB_URI" --http-method=POST --oauth-service-account-email="$SCHEDULER_ACCOUNT"
          fi
          gcloud run services add-iam-policy-binding daleel-api --project="$PROJECT" --region="$REGION" --member=allUsers --role=roles/run.invoker
          REVISION=$(gcloud run services describe daleel-api --project="$PROJECT" --region="$REGION" --format='value(status.latestCreatedRevisionName)')
          gcloud run services update-traffic daleel-api --project="$PROJECT" --region="$REGION" --to-revisions="$REVISION=100"
