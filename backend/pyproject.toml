[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daleel-backend"
version = "0.1.0"
description = "Daleel research control plane and agent workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "PyJWT[crypto]>=2.10,<3", "cryptography>=44", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4",
  "playwright>=1.50,<2", "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "boto3>=1.36,<2",
  "google-cloud-run>=0.10,<1", "email-validator>=2,<3", "PyYAML>=6,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["daleel*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
